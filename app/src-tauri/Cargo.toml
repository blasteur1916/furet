[package]
name = "furet"
version = "0.1.0"
description = "Retrouve n'importe quel fichier par ce qu'il contient ou par son nom, entièrement sur le PC."
authors = ["Furet contributors"]
edition.workspace = true
license.workspace = true

[lib]
# Le suffixe `_lib` distingue la librairie du programme (rust-lang/cargo#8519).
name = "furet_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-log = "2.10"
tauri-plugin-single-instance = "2.5"
tauri-plugin-opener = "2.7"
anyhow.workspace = true
furet-moteur.workspace = true
# Les miniatures de Windows, servies en PNG à l'interface.
png = "0.18"
log.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-updater = "2.14.1"

# Même version que celle de Tauri, pour que les types HWND correspondent.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
	"Win32_Foundation",
	"Win32_Graphics_Gdi",
	"Win32_System_Com",
	"Win32_System_Ole",
	"Win32_System_Power",
	"Win32_System_Threading",
	"Win32_UI_Shell",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_WindowsAndMessaging",
] }
# Même version que celle de wry : mémoire de la WebView quand l'île est fermée.
webview2-com = "0.39"
