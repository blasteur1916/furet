<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- L'icône de Furet : une tête de furet (« fureter » : fouiller partout), sur un fond bleu-violet. -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d8bff"/>
      <stop offset="1" stop-color="#6a3df0"/>
    </linearGradient>
    <linearGradient id="pelage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf3e8"/>
      <stop offset="1" stop-color="#efe1cf"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#fond)"/>
  <!-- Oreilles -->
  <circle cx="318" cy="318" r="104" fill="url(#pelage)"/>
  <circle cx="706" cy="318" r="104" fill="url(#pelage)"/>
  <circle cx="324" cy="326" r="58" fill="#f0b6bf"/>
  <circle cx="700" cy="326" r="58" fill="#f0b6bf"/>
  <!-- Tête -->
  <ellipse cx="512" cy="566" rx="318" ry="282" fill="url(#pelage)"/>
  <!-- Le masque sombre autour des yeux -->
  <ellipse cx="392" cy="528" rx="138" ry="92" fill="#4b3a2f" transform="rotate(-14 392 528)"/>
  <ellipse cx="632" cy="528" rx="138" ry="92" fill="#4b3a2f" transform="rotate(14 632 528)"/>
  <ellipse cx="512" cy="508" rx="70" ry="46" fill="#4b3a2f"/>
  <!-- Yeux -->
  <circle cx="398" cy="522" r="44" fill="#15151b"/>
  <circle cx="626" cy="522" r="44" fill="#15151b"/>
  <circle cx="384" cy="506" r="15" fill="#fff"/>
  <circle cx="612" cy="506" r="15" fill="#fff"/>
  <!-- Museau -->
  <ellipse cx="512" cy="672" rx="150" ry="108" fill="#fffaf3"/>
  <path d="M478 628 Q512 614 546 628 Q552 650 512 674 Q472 650 478 628 Z" fill="#e8808e"/>
  <path d="M512 674 L512 702 M512 702 Q486 728 462 712 M512 702 Q538 728 562 712" fill="none" stroke="#6b5446" stroke-width="12" stroke-linecap="round"/>
</svg>
